# Demo dataset descriptor -- see app/app_configs.py.
# Paths are relative to the repository root.
LABEL: "PARSE2022 (pulmonary vessels)"
ORDER: 1

# The configs/ file that configs_parser.py should load for this dataset.
CONFIG_FILENAME: "experiment_sota/parse2022_LC_32_50_ours_eval.yaml"

# Folder scanned to populate the volume picker.
VOLUMES_PATH: "data/parse2022/eval"

# Loaded on startup when this dataset is selected (falls back to the first
# volume in VOLUMES_PATH if it is missing).
DEFAULT_VOLUME_PATH: "data/parse2022/eval/PA000310_vessel.nii.gz"

# Display orientation for every volume of this dataset, [x, y, z] degrees,
# applied about the volume's centre (extrinsic X, then Y, then Z). It rotates
# the RENDERED model only -- voxel indices, clicks and the backend are
# untouched. Use it so an object stands up the way it reads best (and so a
# horizontal turntable spin looks right).
#   world X = array axis 0, Y = axis 1, Z = axis 2, so a np.rot90(k=1) step in
#   a plane is +/-90 here: axes=(0,2) -> [0, -90, 0], axes=(1,2) -> [90, 0, 0],
#   axes=(0,1) -> [0, 0, 90]. Flip the sign if it comes out mirrored.
INITIAL_VOLUMES_ROTATION: [-90, 0, 0]
